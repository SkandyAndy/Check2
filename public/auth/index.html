<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check App – Authentifizierung</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 360px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #6bcb77;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 0.5rem; font-size: 1.2rem; }
    p  { margin: 0; color: rgba(255,255,255,0.5); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Authentifizierung läuft…</h2>
    <p id="msg">Du wirst gleich zur App weitergeleitet.</p>
  </div>

  <script>
    (function () {
      // Google returns token in the URL *fragment* (#access_token=...) for implicit flow
      var hash = window.location.hash.substring(1); // strip leading #
      var query = window.location.search.substring(1); // fallback: query string (?error=...)

      var hashParams  = new URLSearchParams(hash);
      var queryParams = new URLSearchParams(query);

      var token = hashParams.get('access_token');
      var error = queryParams.get('error') || hashParams.get('error');

      if (error) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Fehler bei der Anmeldung';
        document.getElementById('msg').textContent = 'Bitte schliesse dieses Fenster und versuche es erneut. (' + error + ')';
        // Also notify the app so it can reset the loading state
        setTimeout(function () {
          window.location.href = 'com.check.app://auth?error=' + encodeURIComponent(error);
        }, 500);
        return;
      }

      if (token) {
        // Redirect to app deep link with the token as query param (not fragment)
        var appUrl = 'com.check.app://auth?access_token=' + encodeURIComponent(token);
        window.location.href = appUrl;

        // Fallback message (e.g. opened in desktop browser)
        setTimeout(function () {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('title').textContent = 'Anmeldung abgeschlossen ✓';
          document.getElementById('msg').textContent = 'Du kannst dieses Fenster schliessen.';
        }, 3000);
      } else {
        // No token and no error – likely opened directly in browser without OAuth params
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Kein Token erhalten';
        document.getElementById('msg').textContent = 'Bitte verwende die Check App, um dich anzumelden.';
      }
    })();
  </script>
</body>
</html>
